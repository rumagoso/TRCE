<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rubin Creative Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-primary: #e0e0e0;
            --text-muted: #888888;
            --accent: #d4af37; /* Zen gold */
            --border: #333333;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 2rem;
            box-sizing: border-box;
            text-align: center;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin-bottom: 0.2rem;
            color: #ffffff;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        select {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            outline: none;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.5rem 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .category-tag {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-weight: 600;
        }

        .mode-tag {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .prompt-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            line-height: 1.6;
            margin: 1rem 0;
            color: #ffffff;
        }

        .btn-generate {
            background-color: var(--accent);
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-generate:hover {
            background-color: #e6c547;
            transform: translateY(-2px);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* Animation class */
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>The Rubin Creative Engine</h1>
            <p>"Creativity is not a career; it's a way of being."</p>
        </header>

        <div class="controls">
            <select id="categorySelect">
                <option value="all">All Exercises</option>
                <option value="1">1. The Small Seed</option>
                <option value="2">2. 20-Minute Trash</option>
                <option value="3">3. Constraints</option>
                <option value="4">4. Subtraction</option>
                <option value="5">5. Cross-Pollination</option>
                <option value="6">6. Audience of One</option>
            </select>

            <select id="modeSelect">
              <option value="drawing">Drawing Prompt</option>
               <option value="writing">Writing Prompt</option>
            </select>
        </div>

        <div class="card" id="card">
            <span class="category-tag" id="catDisplay">Category</span>
            <span class="mode-tag" id="modeDisplay">Drawing</span>
            <div class="prompt-text" id="promptDisplay">Click the button below to pull a random creative seed from the universe.</div>
        </div>

        <button class="btn-generate" onclick="generatePrompt()">Generate Prompt</button>

        <footer>
            Built for creators. Open source & free.
        </footer>
    </div>

    <script>
        const database = [
            // Category 1: Small Seeds
            { catId: "1", catName: "1. The Small Seed", writing: "The sound of a heavy door locking in a cathedral.", drawing: "Sketch the 'weight' of a shadow cast by a heavy object." },
            { catId: "1", catName: "1. The Small Seed", writing: "A 'bruise-purple' sunset over an industrial park.", drawing: "Use only purple and grey to capture 'ugly' beauty." },
            { catId: "1", catName: "1. The Small Seed", writing: "\"The key fits, but the house behind it is gone.\"", drawing: "Draw a doorway that leads to a different dimension." },
            { catId: "1", catName: "1. The Small Seed", writing: "The smell of rain hitting hot asphalt (petrichor).", drawing: "Draw the 'energy' of steam rising from the ground." },
            { catId: "1", catName: "1. The Small Seed", writing: "A character in a tuxedo at a 2 AM laundromat.", drawing: "Sketch just the hands of someone doing a mundane task." },
            { catId: "1", catName: "1. The Small Seed", writing: "Describe a storm using 5 'found' words from a book.", drawing: "Draw a storm using only those 5 words as the lines." },
            { catId: "1", catName: "1. The Small Seed", writing: "A rusted fence described as a topographical map.", drawing: "Use 'stippling' (dots) to draw a texture of decay." },
            { catId: "1", catName: "1. The Small Seed", writing: "\"He spoke like a man who ran out of vowels.\"", drawing: "Draw a portrait using only hard, angular lines." },
            { catId: "1", catName: "1. The Small Seed", writing: "The feeling of a 'ghost limb' that still aches.", drawing: "Draw an object where the most important part is missing." },
            { catId: "1", catName: "1. The Small Seed", writing: "A clock that ticks only when someone tells a lie.", drawing: "Draw a mechanical object that looks 'dishonest.'" },

            // Category 2: 20-Minute Trash
            { catId: "2", catName: "2. 20-Minute Trash", writing: "A 'bad' eulogy for a burned-out toaster.", drawing: "Sketch the 'ghost' of a broken household appliance." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "Dialogue between two left shoes in a thrift store.", drawing: "Speed-draw a pair of shoes in under 60 seconds." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "A grocery list for a dragon on a vegan diet.", drawing: "Draw a dragon eating something embarrassing (like kale)." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "Describe the color 'yellow' to a deaf creature.", drawing: "Fill a page with 'yellow' shapes—no outlines allowed." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "A break-up letter from a haunted house to its owners.", drawing: "Draw a house that looks like it's 'shrugging.'" },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "A travel brochure for a fever-dream destination.", drawing: "Draw a map of a place that makes no physical sense." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "The monologue of an elderly cat watching a bird.", drawing: "Draw a cat using only your non-dominant hand." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "Manual on 'How to be a Professional Cloud.'", drawing: "Draw 10 different 'cloud personalities' in 5 minutes." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "A commercial for 'Genuine Moonlight' in a bottle.", drawing: "Draw light trapped inside a glass container." },
            { catId: "2", catName: "2. 20-Minute Trash", writing: "Why the letter 'Q' is plotting a world takeover.", drawing: "Turn the letter 'Q' into a villainous character." },

            // Category 3: Constraints
            { catId: "3", catName: "3. Constraints", writing: "Every sentence must start with A through J.", drawing: "Draw a scene using only straight lines (no curves)." },
            { catId: "3", catName: "3. Constraints", writing: "A car chase using no 'verbs of movement.'", drawing: "Draw a 'fast' scene using only 'slow' colors (blues/tans)." },
            { catId: "3", catName: "3. Constraints", writing: "A love story told in medical or scientific jargon.", drawing: "Draw a romantic scene using only geometric shapes." },
            { catId: "3", catName: "3. Constraints", writing: "A forest without saying: green, tree, leaf, or wood.", drawing: "Draw a forest using only a single red pen." },
            { catId: "3", catName: "3. Constraints", writing: "A 100-word story where every word is one syllable.", drawing: "Draw a complex figure using only 10 total strokes." },
            { catId: "3", catName: "3. Constraints", writing: "A dialogue where every sentence is a question.", drawing: "Draw a portrait without ever looking at the paper." },
            { catId: "3", catName: "3. Constraints", writing: "A horror scene using only 'soft' words (velvet, hush).", drawing: "Draw a monster that looks 'cuddly' or 'soft.'" },
            { catId: "3", catName: "3. Constraints", writing: "Describe a wedding in exactly five-word sentences.", drawing: "Draw a 'crowd' using only vertical tally marks." },
            { catId: "3", catName: "3. Constraints", writing: "A story told only in footnotes to a missing text.", drawing: "Draw only the shadows of objects, not the objects." },
            { catId: "3", catName: "3. Constraints", writing: "A heist where they only talk about the weather.", drawing: "Draw a 'crime' using only 'peaceful' colors." },

            // Category 4: Subtraction
            { catId: "4", catName: "4. Subtraction", writing: "Write 300 words on betrayal; cut it to 30.", drawing: "Draw a scene; erase 70% of it. What remains?" },
            { catId: "4", catName: "4. Subtraction", writing: "Describe your first memory; cut it to 5 words.", drawing: "Draw a memory using only three colors." },
            { catId: "4", catName: "4. Subtraction", writing: "Write a page about a forest; delete every adjective.", drawing: "Draw a tree. Remove the trunk. Is it still a tree?" },
            { catId: "4", catName: "4. Subtraction", writing: "A letter to your future self; keep only the commands.", drawing: "Draw your 'future' using only one single line." },
            { catId: "4", catName: "4. Subtraction", writing: "Describe a city; remove all the nouns.", drawing: "Sketch a city using only 'gestural' scribbles (no detail)." },
            { catId: "4", catName: "4. Subtraction", writing: "A manifesto for a new planet; keep only the verbs.", drawing: "Draw a planet using only the 'motion' of its orbits." },
            { catId: "4", catName: "4. Subtraction", writing: "Recount a dream; remove all references to 'I/Me.'", drawing: "Draw a dream; leave the center of the page white." },
            { catId: "4", catName: "4. Subtraction", writing: "A magic recipe; strip it to 3 ingredients and 1 verb.", drawing: "Draw a 'power' using only 3 simple symbols." },
            { catId: "4", catName: "4. Subtraction", writing: "A poem; keep only the first and last line.", drawing: "Draw a face; keep only the eyes and the chin." },
            { catId: "4", catName: "4. Subtraction", writing: "A deep feeling cut down to one sharp metaphor.", drawing: "Represent 'Grief' or 'Joy' with a single dot." },

            // Category 5: Cross-Pollination
            { catId: "5", catName: "5. Cross-Pollination", writing: "Listen to a jazz solo; write the landscape it makes.", drawing: "Draw the 'shape' of a trumpet's sound." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Look at abstract art; write the 'dialogue' of Red.", drawing: "Paint/Draw the 'sound' of a heavy bass guitar." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Write E=mc² as a family drama.", drawing: "Draw a 'mathematical equation' as a living creature." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Taste something sour; write a 'sour' memory.", drawing: "Draw a 'sour' color palette (yellows/greens/pinks)." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Smell a spice; write a character based on it.", drawing: "Draw the 'portrait' of the smell of Cinnamon." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "An architectural blueprint; write of its 'ghosts.'", drawing: "Draw a 'skeleton' of a house, but with human organs." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Watch a silent film; write a background extra's story.", drawing: "Sketch a scene from a movie you've never seen." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Touch wood/stone; write the history of who held it.", drawing: "Draw the 'texture' of a stone using only your eyes." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "Listen to static; write the conversation you 'hear.'", drawing: "Draw the 'visual' of radio static." },
            { catId: "5", catName: "5. Cross-Pollination", writing: "A satellite map of a desert; write its legend.", drawing: "Draw a 'microscopic' view of a grain of sand." },

            // Category 6: Audience of One
            { catId: "6", catName: "6. Audience of One", writing: "Write your biggest secret; delete it immediately.", drawing: "Draw your 'hidden self.' Burn it afterward." },
            { catId: "6", catName: "6. Audience of One", writing: "Explain a truth you believe that no one agrees with.", drawing: "Draw your 'unpopular opinion' as a totem/statue." },
            { catId: "6", catName: "6. Audience of One", writing: "Write a 'thank you' to the person who hurt you.", drawing: "Draw 'forgiveness' as a physical landscape." },
            { catId: "6", catName: "6. Audience of One", writing: "Describe a 'guilty pleasure' as a noble pursuit.", drawing: "Draw your favorite 'trash' food as a royal feast." },
            { catId: "6", catName: "6. Audience of One", writing: "A moment of shame, but you are the hero.", drawing: "Draw your 'weakness' as if it were a superpower." },
            { catId: "6", catName: "6. Audience of One", writing: "A conversation with your inner child.", drawing: "Draw what your 8-year-old self wanted to be." },
            { catId: "6", catName: "6. Audience of One", writing: "The one thing you’re glad you kept secret.", drawing: "Draw a 'box' that contains your most private thought." },
            { catId: "6", catName: "6. Audience of One", writing: "Your 5 'embarrassing' obsessions.", drawing: "Draw a 'merger' of your 3 favorite hobbies." },
            { catId: "6", catName: "6. Audience of One", writing: "Describe your 'selfish' ideal world.", drawing: "Draw a map of a world where you are the only citizen." },
            { catId: "6", catName: "6. Audience of One", writing: "A letter to 'you' from 10 years ago.", drawing: "Draw a 'portrait' of who you were 10 years ago." }
        ];

        function generatePrompt() {
            const categoryFilter = document.getElementById('categorySelect').value;
            const mode = document.getElementById('modeSelect').value;
            
            // Filter database
            let filtered = database;
            if (categoryFilter !== 'all') {
                filtered = database.filter(item => item.catId === categoryFilter);
            }

            // Pick a random item
            const randomIndex = Math.floor(Math.random() * filtered.length);
            const selected = filtered[randomIndex];

            // Get elements
            const card = document.getElementById('card');
            const catDisplay = document.getElementById('catDisplay');
            const modeDisplay = document.getElementById('modeDisplay');
            const promptDisplay = document.getElementById('promptDisplay');

            // Trigger animation
            card.classList.remove('fade-in');
            void card.offsetWidth; // trigger reflow
            card.classList.add('fade-in');

            // Update content
            catDisplay.textContent = selected.catName;
            modeDisplay.textContent = mode.toUpperCase();
            promptDisplay.textContent = mode === 'writing' ? selected.writing : selected.drawing;
        }
    </script>
</body>
</html>
